name: Deploy Latest Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: latest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test system integration boundaries
        run: node --test tests/*.test.mjs
      - name: Check responsive browser layouts
        run: node scripts/check_browser.mjs
      - name: Build and validate package
        run: |
          VERSION="$(python3 -c 'import json,os; m=json.load(open("module.json")); print(".".join(m["version"].split(".")[:2])+"."+os.environ["GITHUB_RUN_NUMBER"])')"
          RELEASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/latest"
          python3 scripts/build_release.py --version "$VERSION" --manifest-url "$RELEASE/module.json" --download-url "$RELEASE/ve-mobile.zip"
          python3 scripts/build_release.py --version "$VERSION" --experimental-fallback --manifest-url "$RELEASE/module-experimental.json" --download-url "$RELEASE/ve-mobile-experimental.zip"
          cp dist/experimental/module.json dist/module-experimental.json
          cp dist/experimental/ve-mobile.zip dist/ve-mobile-experimental.zip
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Publish rolling latest release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest
          cat > dist/release-notes.md <<EOF
          Built from main at $GITHUB_SHA. Version $RELEASE_VERSION.

          Mikelandia Controls is an in-person companion with Character, Chat, Journals, Combat and Settings.
          Scene navigation, map/token controls and token-light actions are removed. Combat keeps initiative and encounter progression.
          Phone and Tablet hide unrelated module widgets while retaining module-launched native workflows, roll dialogs, feedback and Dice So Nice.
          UI isolation is covered by browser fixtures with and without Common Display Hide UI.

          Both module.json and module-experimental.json support all systems without metadata filtering.
          Use module-experimental.json for the experimental cross-system description; both channels share the same module ID.

          Automated source/browser checks do not establish physical-device or live-world compatibility for this revision.
          Existing native WFRP ammunition behavior is unchanged.
          EOF
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest Build" --notes-file dist/release-notes.md --latest
          else
            gh release create latest --verify-tag --title "Latest Build" --notes-file dist/release-notes.md --latest
          fi
          gh release upload latest dist/module.json dist/ve-mobile.zip dist/module-experimental.json dist/ve-mobile-experimental.zip --clobber
      - name: Verify public Foundry installation files
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/check_release.py --base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest" --version "$RELEASE_VERSION" --build "$GITHUB_SHA"
