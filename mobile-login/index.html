<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#111b24">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mikelandia Controls">
  <title>Mikelandia · Join your game</title>
  <link rel="stylesheet" href="./login.css">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icons/mc-192.png">
  <link rel="apple-touch-icon" href="./icons/mc-180.png">
  <script type="module" src="./pwa.mjs"></script>
  <script type="module" src="./main.mjs"></script>
</head>
<body>
  <main class="login-card" aria-labelledby="world-title">
    <header>
      <p class="brand">MIKELANDIA CONTROLS</p>
      <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true"><path d="M32 4 57 18v28L32 60 7 46V18Z M7 18l25 14 25-14M32 32v28M32 4v28L7 46m25-14 25 14" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <p class="eyebrow">Your next adventure</p>
      <h1 id="world-title">Join your game</h1>
    </header>
    <p id="status" role="status" aria-live="polite">Connecting to Foundry…</p>
    <form id="login-form" hidden>
      <label for="player">Player</label>
      <select id="player" name="userId" autocomplete="username" required></select>
      <label for="password">Password <span>(if required)</span></label>
      <input id="password" name="password" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false">
      <button id="join" type="submit">Join game <span aria-hidden="true">→</span></button>
    </form>
    <p id="error" role="alert" hidden></p>
    <button id="retry" class="secondary" type="button" hidden>Try again</button>
    <footer>
      <div id="app-install">
        <button id="install-app" class="secondary" type="button" hidden>Install Mikelandia Controls</button>
        <p class="install-help">For a view without the address bar, install this page from your browser menu: <strong>Add to home screen → Install</strong>. On iPhone or iPad, use <strong>Share → Add to Home Screen</strong>. Then open the MC icon.</p>
      </div>
      <a id="standard-login" href="../join">Standard Foundry login</a>
    </footer>
    <noscript><p>JavaScript is needed for mobile login. Use the standard Foundry login link above.</p></noscript>
  </main>
</body>
</html>
